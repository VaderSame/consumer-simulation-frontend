server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security & privacy headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable access logging of query strings/IPs for participant privacy (REB compliance)
    access_log off;

    # Reverse proxy for FastAPI backend endpoints (with unbuffered SSE streaming)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Crucial for token-by-token live advisor streaming (/api/v1/advisor/stream)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Interactive API docs & OpenAPI schema
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # React SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
